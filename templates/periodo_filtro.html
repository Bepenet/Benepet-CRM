<style>
    .grupo-periodo-filtro { display: flex; flex-direction: column; }
    .grupo-periodo-filtro label { margin-bottom: 5px; color: #34495e; font-weight: 500; font-size: 13px; }
    .grupo-periodo-filtro select, .grupo-periodo-filtro input[type="date"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; min-width: 160px; }
</style>
<div class="grupo-periodo-filtro">
    <label for="periodo">Período</label>
    <select id="periodo" name="periodo" onchange="alternarPeriodo()">
        <option value="mes" {% if periodo == 'mes' %}selected{% endif %}>Mês</option>
        <option value="ano" {% if periodo == 'ano' %}selected{% endif %}>Ano</option>
        <option value="periodo" {% if periodo == 'periodo' %}selected{% endif %}>Período específico</option>
    </select>
</div>
<div class="grupo-periodo-filtro" id="grupo-mes">
    <label for="mes">Mês</label>
    <select id="mes" name="mes">
        {% for numero in range(1, 13) %}
        <option value="{{ numero }}" {% if numero == mes %}selected{% endif %}>{{ meses_nomes[numero - 1] }}</option>
        {% endfor %}
    </select>
</div>
<div class="grupo-periodo-filtro" id="grupo-ano">
    <label for="ano">Ano</label>
    <select id="ano" name="ano">
        {% for ano_opcao in range(hoje.year + 1, hoje.year - 6, -1) %}
        <option value="{{ ano_opcao }}" {% if ano_opcao == ano %}selected{% endif %}>{{ ano_opcao }}</option>
        {% endfor %}
    </select>
</div>
<div class="grupo-periodo-filtro" id="grupo-data-inicio">
    <label for="data_inicio">Data Início</label>
    <input type="date" id="data_inicio" name="data_inicio" value="{{ data_inicio_str }}">
</div>
<div class="grupo-periodo-filtro" id="grupo-data-fim">
    <label for="data_fim">Data Fim</label>
    <input type="date" id="data_fim" name="data_fim" value="{{ data_fim_str }}">
</div>
<script>
function alternarPeriodo() {
    var periodo = document.getElementById('periodo').value;
    document.getElementById('grupo-mes').style.display = (periodo === 'mes') ? 'flex' : 'none';
    document.getElementById('grupo-ano').style.display = (periodo === 'periodo') ? 'none' : 'flex';
    document.getElementById('grupo-data-inicio').style.display = (periodo === 'periodo') ? 'flex' : 'none';
    document.getElementById('grupo-data-fim').style.display = (periodo === 'periodo') ? 'flex' : 'none';
}
alternarPeriodo();
</script>
